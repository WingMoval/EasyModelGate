# EasyModelGate 开发环境（micromamba/conda）
# 创建：micromamba create -y -n easymodelgate-dev python=3.12.13
#       micromamba run -n easymodelgate-dev pip install -r requirements.txt
name: easymodelgate-dev
channels:
  - conda-forge
dependencies:
  - python=3.12.13
  - pip
  - pip:
      - fastapi==0.141.1
      - starlette==1.6.0
      - httpx==0.28.1
      - uvicorn==0.52.4
      - aiosqlite==0.22.1
      - pydantic==2.13.4
      - jinja2==3.1.6
      - pytest==9.1.1
      - pytest-asyncio==1.4.0
