{% extends "base.html" %}

{% set active_nav = 'keys' %}
{% set page_title = 'API Keys' %}

{% block content %}
<div class="page-header">
    <h1>API Keys</h1>
    <div class="page-actions">
        <button class="btn btn-primary" id="btn-create-key" disabled>Create Key</button>
    </div>
</div>

<div class="section">
    <div class="table-container">
        <table class="data-table" id="keys-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>User</th>
                    <th>Prefix</th>
                    <th>RPM</th>
                    <th>Token Usage</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr class="loading-row">
                    <td colspan="8"><span class="badge badge-loading">Loading...</span></td>
                </tr>
            </tbody>
        </table>
    </div>
    <p class="hint">API Key management UI will be implemented in a future version. Use the Admin API directly for now.</p>
</div>
{% endblock %}
