{% extends "base.html" %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <span class="login-icon"></span>
            <h1>EasyModelGate Admin</h1>
            <p class="login-subtitle">Sign in to continue</p>
        </div>

        {% if not initialized %}
        <div class="alert alert-warning" role="alert">
            <strong>Admin not initialized.</strong>
            Please run on the server:
            <pre class="cmd">python -m easymodelgate --config <CONFIG> admin init</pre>
        </div>
        {% endif %}

        <form id="login-form" novalidate>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required aria-required="true">
            </div>
            <div id="login-error" class="form-error" aria-live="polite"></div>
            <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('admin-static', path='login.js') }}"></script>
{% endblock %}
